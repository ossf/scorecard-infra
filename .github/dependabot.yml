version: 2
updates:
- package-ecosystem: "gomod"
  directory: "/"
  schedule:
    interval: "weekly"
  cooldown:
    default-days: 7
  groups:
    gomod:
      patterns:
        - "*"
      exclude-patterns:
        - "golang.org/x/*"
        - "github.com/google/osv-scanner/*"
        - "github.com/rhysd/actionlint"
    golang-x:
      patterns:
        - "golang.org/x/*"
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: "weekly"
  cooldown:
    default-days: 7
  groups:
    github-actions:
      patterns:
        - "*"
      exclude-patterns:
        - "actions/*"
        - "github/*"
        - "golangci/*"
    github-owned:
      patterns:
        - "actions/*"
        - "github/*"
    golangci:
      patterns:
        - "golangci/*"

# Batch pipeline container images. Six, not the five the migration plan
# anticipated: the GitHub token-pool server's Dockerfile moved into cron/ with
# the rest of the pipeline (C6), so it is covered here rather than upstream.
#
# All six pin identical base images, so six per-directory entries produced
# twelve PRs to carry two distinct bumps. One entry with a `directories` glob
# covers them instead; `group-by` then collapses each bump into a single PR
# spanning all six directories, one per image rather than one per directory.
# The glob also picks up any future pipeline image without a config change.
- package-ecosystem: "docker"
  directories:
    - "/cron/internal/*"
  schedule:
    interval: "weekly"
  cooldown:
    default-days: 7
  groups:
    pipeline-images:
      patterns:
        - "*"
      group-by: "dependency-name"

# The API server image. Kept separate from the pipeline glob above rather than
# folded into it: both trees build from `golang`, so a shared group keyed on
# dependency name would pull this Dockerfile's alpine variant into the same PR
# as the pipeline's bookworm one despite the two tracking different tags.
- package-ecosystem: "docker"
  directory: "/"
  schedule:
    interval: "weekly"
  cooldown:
    default-days: 7
  groups:
    api-server-image:
      patterns:
        - "*"
      group-by: "dependency-name"

# The imported results API's image (api/Dockerfile). Separate again, for the
# same reason: it builds both its stages from `golang` pinned by digest, which
# is a third tag lineage distinct from the pipeline's and the API server's.
- package-ecosystem: "docker"
  directory: "/api"
  schedule:
    interval: "weekly"
  cooldown:
    default-days: 7
  groups:
    results-api-image:
      patterns:
        - "*"
      group-by: "dependency-name"
