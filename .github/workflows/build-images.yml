# Builds this repository's container images. These builds do not push: the
# pipeline's images are published by Cloud Build (cron/cloudbuild/*.yaml) and the
# results API's by publish-api-image.yml. This workflow only proves the images
# still build from this repository.

name: build-images

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  docs_only_check:
    name: Check for docs-only change
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      docs_only: ${{ steps.docs_only_check.outputs.docs_only }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit # TODO(workflow): change to 'egress-policy: block' after a couple of runs

      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # needed to diff changed files
          persist-credentials: false

      - id: docs_only_check
        name: Check for docs-only changes
        run: |
          set +e # don't fail based on grep exit code
          git diff --name-only HEAD~1 | grep --ignore-case --invert-match '.md$'
          if [ $? -eq 1 ]; then
              # no grep match (all files end in .md) produces exit code 1
              echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
              echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

  docker_matrix:
    strategy:
      fail-fast: false
      matrix:
        target:
          - 'cron-controller-docker'
          - 'cron-worker-docker'
          - 'cron-cii-worker-docker'
          - 'cron-bq-transfer-docker'
          - 'cron-webhook-docker'
          - 'cron-github-server-docker'
          # The results API. Its Dockerfile builds from the repository root
          # because go.mod lives there, so a stale path inside it fails here and
          # nowhere else -- which is the whole reason this job covers it.
          - 'api-docker'
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: docs_only_check
    # Ideally one "if" on the job, but skipped matrix jobs don't work that way.
    # https://github.com/orgs/community/discussions/9141
    steps:
      - name: Harden Runner
        if: (needs.docs_only_check.outputs.docs_only != 'true')
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit # TODO(workflow): change to 'egress-policy: block' after a couple of runs

      - name: Clone the code
        if: (needs.docs_only_check.outputs.docs_only != 'true')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Needed for the Makefile's shell evaluations even though the build itself
      # happens in Docker.
      - name: Setup Go
        if: (needs.docs_only_check.outputs.docs_only != 'true')
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
          check-latest: true
          cache: false # building happens in Docker; this cache would evict more useful entries

      # Retried: each image runs `go mod download` inside its build container,
      # and six of them run at once, so this hammers the module proxy. Observed
      # repeatedly: "stream error ... INTERNAL_ERROR" from proxy.golang.org,
      # failing an otherwise good build. BuildKit's layer cache makes a retry
      # cheap -- it resumes at the failed layer rather than rebuilding.
      - name: docker build
        if: (needs.docs_only_check.outputs.docs_only != 'true')
        run: |
          for attempt in 1 2 3; do
            if make ${{ matrix.target }}; then
              exit 0
            fi
            echo "::warning::attempt $attempt failed, retrying"
            sleep $((attempt * 20))
          done
          echo "::error::${{ matrix.target }} failed after 3 attempts"
          exit 1

      # The API is the only image here that is a long-running server with a
      # health endpoint, so it is the only one this is cheap for. The pipeline
      # images are batch jobs that need credentials and a PubSub subscription to
      # do anything, and starting them would test the runner's environment
      # rather than the image. See the api-docker-smoke comment in the Makefile.
      #
      # Not retried: unlike the build, this reaches nothing over the network, so
      # a failure here is the image and not the module proxy.
      - name: The API image serves
        if: (matrix.target == 'api-docker' && needs.docs_only_check.outputs.docs_only != 'true')
        run: make api-docker-smoke
