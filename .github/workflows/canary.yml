# Builds and tests this repository against ossf/scorecard's main branch.
#
# Why this exists (design C7/C8): before the migration, the batch pipeline lived
# in ossf/scorecard and was built against the in-tree engine, so an engine change
# that broke the pipeline failed at PR time. After the split the pipeline builds
# against a pinned engine release, which makes production reproducible but moves
# breakage discovery to dependency-bump time. This canary buys most of that
# signal back.
#
# It is deliberately NOT a pull-request check. It tests someone else's branch, so
# a red run usually means upstream work in progress, and gating this repository's
# PRs on that would block unrelated changes. It must still be watched: a canary
# nobody reads is worse than no canary, because it manufactures confidence.
#
# A sustained red canary is a signal to talk to the engine maintainers BEFORE the
# next dependency bump lands, not after.

name: canary

on:
  schedule:
    # 06:17 UTC daily. Off the hour on purpose: scheduled workflows bunch up on
    # the hour and get queued.
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-against-engine-main:
    name: build and test against scorecard main
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit # TODO(workflow): change to 'egress-policy: block' after a couple of runs

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
          check-latest: true

      - name: Point the engine dependency at upstream main
        run: |
          go get github.com/ossf/scorecard/v5@main
          go mod tidy
          echo "Resolved engine version:"
          go list -m github.com/ossf/scorecard/v5

      - name: Build
        run: go build ./...

      # Runs the whole suite, which includes cron/internal/format's
      # Test_GenerateBQSchema and Test_GenerateJSONSchema. Those verify the
      # published BigQuery/JSON schema contract against the engine's Go data
      # model, so this step is also the C8 cross-repo drift check: it catches a
      # data-model change before the corresponding release is ever pinned.
      - name: Test
        run: go test ./... -race

      # The dependency bump itself must fail hard on schema drift rather than
      # warn. That is enforced by the same tests running in presubmits.yml
      # against the pinned version; this job is the early warning, not the gate.
      - name: Report the go.mod delta
        if: always()
        run: git diff --no-color go.mod || true

  # Without this, the canary is decorative: a scheduled job's failures are
  # invisible unless someone thinks to open the Actions tab, and a signal nobody
  # receives is worse than no signal because it manufactures confidence.
  #
  # Deliberately one issue, reopened and commented rather than a new issue per
  # run. A daily job that files a daily issue trains people to mute it.
  report-failure:
    name: report canary failure
    needs: build-against-engine-main
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit # TODO(workflow): change to 'egress-policy: block' after a couple of runs

      - name: Open or update the canary issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: 'canary: batch pipeline fails against ossf/scorecard main'
        run: |
          set -euo pipefail
          existing=$(gh issue list --repo "$REPO" --state open \
            --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" \
              --body "Still failing as of $(date -u +%Y-%m-%d). Run: $RUN_URL"
          else
            gh issue create --repo "$REPO" --title "$TITLE" --body "$(cat <<BODY
          The scheduled canary builds this repository's batch pipeline against
          \`ossf/scorecard\`'s \`main\` branch, ahead of the pinned release. It failed.

          Run: $RUN_URL

          **This does not mean this repository is broken.** Pull requests here build
          against the pinned engine release and are unaffected. What it means is that
          an unreleased engine change is incompatible with the pipeline, or has moved
          the data model out from under the published BigQuery/JSON schema.

          Act on it *before* the next dependency bump rather than after: raise it with
          the engine maintainers while the change is still theirs to adjust. Left
          alone, it resurfaces as a red dependency bump with less context and less
          room to negotiate.

          This issue is reused for subsequent failures. Close it once the canary is
          green again.
          BODY
          )"
          fi
