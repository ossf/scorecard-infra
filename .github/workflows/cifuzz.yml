name: CIFuzz

on: [pull_request]

permissions: {}

jobs:
  fuzzing:
    name: Fuzzing
    runs-on: ubuntu-latest
    permissions:
      security-events: write # Needed to upload the fuzzing SARIF to the code-scanning dashboard.
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
      with:
        egress-policy: audit # TODO(workflow): change to 'egress-policy: block' after a couple of runs

    # OSS-Fuzz publishes neither tags nor releases, so a hash pin here would
    # never be bumped by Dependabot and would drift away from the OSS-Fuzz
    # infra images the action pulls at runtime. Upstream documents @master:
    # https://google.github.io/oss-fuzz/getting-started/continuous-integration/
    - name: Build Fuzzers
      id: build
      uses: google/oss-fuzz/infra/cifuzz/actions/build_fuzzers@master # zizmor: ignore[unpinned-uses]
      with:
        oss-fuzz-project-name: 'scorecard-web'
        language: go
        dry-run: false
    - name: Run Fuzzers
      uses: google/oss-fuzz/infra/cifuzz/actions/run_fuzzers@master # zizmor: ignore[unpinned-uses]
      with:
        oss-fuzz-project-name: 'scorecard-web'
        language: go
        dry-run: false
        fuzz-seconds: 300
        output-sarif: true
    - name: Upload Crash
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: failure() && steps.build.outcome == 'success'
      with:
        name: artifacts
        path: ./out/artifacts
    - name: Upload Sarif
      if: always() && steps.build.outcome == 'success'
      uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
      with:
        # Path to SARIF file relative to the root of the repository
        sarif_file: cifuzz-sarif/results.sarif
        checkout_path: cifuzz-sarif
