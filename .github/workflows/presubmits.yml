name: Presubmits

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
      with:
        egress-policy: audit # TODO(workflow): change to 'egress-policy: block' after a couple of runs

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.25'
        check-latest: true

    - name: Build
      run: go build -v ./...

  test:
    runs-on: ubuntu-latest
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
      with:
        egress-policy: audit # TODO(workflow): change to 'egress-policy: block' after a couple of runs

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.25'
        check-latest: true

    # The imported results API's end-to-end specs call api.github.com. Without a
    # token they share the 60/hour unauthenticated per-IP limit with every other
    # runner and fail intermittently -- observed locally as green in isolation
    # and red one run in three under the full suite. Supplying the token is the
    # fix; gating the specs off would drop coverage of the publish path's
    # verification logic instead (design W9).
    #
    # The Sigstore specs additionally call live Rekor. They pass in CI, but skip
    # rather than fail if Rekor's search-by-hash index is unreachable, so a run
    # showing skips is a reachability signal, not a pass.
    - name: Test
      env:
        GITHUB_AUTH_TOKEN: ${{ github.token }}
      run: go test -v -race -covermode=atomic -coverprofile=coverage.out ./...

    - name: Upload code coverage
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        files: ./coverage.out
        verbose: true

  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
      with:
        egress-policy: audit # TODO(workflow): change to 'egress-policy: block' after a couple of runs

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.25'
        check-latest: true

    - name: golangci-lint
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
      with:
        version: v2.8.0

  # License headers on the imported results API, matching the check
  # ossf/scorecard-webapp ran before the migration. Scoped to api/ rather than
  # run repository-wide: four pre-existing files here (.github/dependabot.yml
  # and three workflows) have no header, and fixing those is unrelated to this
  # import. Widening the scope is a separate change.
  license-headers:
    name: license-headers
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
      with:
        egress-policy: audit # TODO(workflow): change to 'egress-policy: block' after a couple of runs

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.25'
        check-latest: true

    # -check reports rather than rewrites, so a miss fails the job instead of
    # producing a diff nobody looks at. Upstream ran addlicense then
    # `git diff --exit-code`; same outcome, one fewer step.
    - name: Check license headers
      run: |
        go run github.com/google/addlicense@2fe3ee94479d08be985a84861de4e6b06a1c7208 \
          -check \
          -ignore "api/app/server/testdata/**" \
          -ignore "api/app/generated/**" \
          -l apache -c 'OpenSSF Scorecard Authors' \
          ./api

  # The imported API and the batch pipeline are behavior-frozen and must stay
  # self-contained: no import edges to or from this repository's own packages,
  # in either direction (designs W10 and C11). The pull-request template has
  # asserted this for cron/ since the pipeline landed, but nothing enforced it.
  import-edges:
    name: import-edges
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
      with:
        egress-policy: audit # TODO(workflow): change to 'egress-policy: block' after a couple of runs

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: No import edges between the frozen trees and internal/
      run: |
        rc=0
        check() {
          # $1 = human description, $2 = grep pattern, $3.. = paths to search
          desc="$1"; pattern="$2"; shift 2
          if hits=$(grep -rnE "$pattern" --include="*.go" "$@" 2>/dev/null); then
            echo "::error::$desc"
            echo "$hits"
            rc=1
          fi
        }
        check "api/ must not import this repository's own packages" \
          '"github\.com/ossf/scorecard-infra/(internal|cmd|cron)' api
        check "cron/ must not import this repository's own packages" \
          '"github\.com/ossf/scorecard-infra/(internal|cmd|api)' cron
        check "internal/ and cmd/ must not import the frozen trees" \
          '"github\.com/ossf/scorecard-infra/(api|cron)' internal cmd
        exit $rc

  # Scan inventory checks for the batch pipeline. add-projects must be a no-op on
  # an already-normalized inventory, so a non-empty diff means someone hand-edited
  # the CSV into a state the tooling would not produce.
  # api/app/generated/ is committed, so nothing forced it to stay in step with
  # api/openapi.yaml -- a spec edit could merge with stale generated code, and
  # did (PR #69). license-headers is the only other job that touches this tree,
  # and only to exclude it. Same shape as add-projects below: run the generator,
  # then assert it changed nothing.
  swagger-verify:
    name: swagger-verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
      with:
        egress-policy: audit # TODO(workflow): change to 'egress-policy: block' after a couple of runs

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.25'
        check-latest: true

    # The version lives in the Makefile so a developer running `make
    # api-swagger` locally is held to the same one; check-swagger fails loudly
    # on a mismatch rather than producing a diff nobody can explain.
    # Retried for the same reason as add-projects: this reaches the module
    # proxy, which flakes.
    - name: Install pinned go-swagger
      run: |
        version="$(make --no-print-directory print-swagger-version)"
        echo "pinned go-swagger: ${version}"
        for attempt in 1 2 3; do
          if go install "github.com/go-swagger/go-swagger/cmd/swagger@${version}"; then
            exit 0
          fi
          echo "::warning::attempt $attempt failed, retrying"
          sleep $((attempt * 15))
        done
        echo "::error::could not install go-swagger ${version} after 3 attempts"
        exit 1

    # git diff alone would miss a *new* generated file, which is exactly what a
    # newly added operation in the spec produces. --porcelain covers both.
    - name: api-swagger is a no-op on a committed spec
      run: |
        make api-swagger
        if [ -n "$(git status --porcelain)" ]; then
          echo "::error::api/app/generated is out of date with api/openapi.yaml -- run 'make api-swagger' and commit the result"
          git status --porcelain
          git diff
          exit 1
        fi

  add-projects:
    name: add-projects
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
      with:
        egress-policy: audit # TODO(workflow): change to 'egress-policy: block' after a couple of runs

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.25'
        check-latest: true

    # Retried: these targets compile Go binaries and so hit the module proxy,
    # which flakes (observed: "stream error ... INTERNAL_ERROR" from
    # proxy.golang.org). Upstream wraps the equivalent jobs in a retry action;
    # this is the same idea without taking a third-party action dependency.
    - name: add-projects is a no-op on a normalized inventory
      run: |
        for attempt in 1 2 3; do
          if make add-projects; then
            git diff --exit-code
            exit $?
          fi
          echo "::warning::attempt $attempt failed, retrying"
          git checkout -- cron/internal/data/ || true
          sleep $((attempt * 15))
        done
        echo "::error::add-projects failed after 3 attempts"
        exit 1

  validate-projects:
    name: validate-projects
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
      with:
        egress-policy: audit # TODO(workflow): change to 'egress-policy: block' after a couple of runs

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.25'
        check-latest: true

    # Retried for the same reason as add-projects above.
    - name: Validate the scan inventories
      run: |
        for attempt in 1 2 3; do
          if make validate-projects; then
            exit 0
          fi
          echo "::warning::attempt $attempt failed, retrying"
          sleep $((attempt * 15))
        done
        echo "::error::validate-projects failed after 3 attempts"
        exit 1
