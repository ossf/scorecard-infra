# Publishes the results API image to ghcr.io.
#
# This is the migration's handoff artifact (design W15). The API is being
# re-hosted away from the GCP project that builds it today, so the image has to
# be pullable by an operator with no access to that project; a neutral registry
# is what makes the artifact, rather than a build configuration, the thing that
# moves. It also front-loads the build/deploy split that the provider exit needs
# either way: this workflow builds and publishes, and whatever runs the service
# only has to deploy a digest.
#
# Releases are tagged `api/vX.Y.Z`, not `vX.Y.Z`. This repository holds more than
# one independently deployable system, and `ossf/scorecard-webapp`'s own `v1.x`
# tags must keep resolving for the module's one remaining consumer -- so a bare
# version tag here would be ambiguous in two directions at once.
#
# Merges publish a MUTABLE tag; releases publish IMMUTABLE ones. `main` moves and
# is what a staging deployment tracks; `api/v*` produces the semver and `latest`
# tags a production deployment pins -- by digest, not by tag. An earlier version
# of this workflow published on tags only, on the reasoning that a public API
# gets an explicit, nameable release. That still holds for production, and the
# mutable tag does not weaken it: staging needs something continuously fresh to
# pull, and the alternative is cutting a release to test a commit.
#
# See also build-images.yml, which proves every image builds on each pull request
# but publishes nothing.
#
# The owner is parameterized so a fork can exercise this end to end -- pushing to
# its own `ghcr.io/<fork-owner>/...` namespace rather than failing at the org's.
# GHCR namespaces must be lowercase and `repository_owner` preserves the
# account's casing, so it is lowercased rather than used raw; an owner with
# capitals otherwise fails at the push with a message about the reference format.

name: publish-api-image

on:
  push:
    branches:
      - main
    tags:
      - 'api/v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Extra tag to apply (e.g. staging). The digest and SHA tag are always published.'
        required: false
        type: string

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit # TODO(workflow): change to 'egress-policy: block' after a couple of runs

      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `api/v1.2.3` -> `1.2.3`. The commit SHA is always published alongside, so
      # a merge or a manual dispatch with no tag input still produces something
      # immutable to pin.
      - name: Derive tags
        id: tags
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          EXTRA_TAG: ${{ inputs.tag }}
          OWNER: ${{ github.repository_owner }}
          REGISTRY: ${{ env.REGISTRY }}
        run: |
          owner="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          image="${REGISTRY}/${owner}/scorecard-api"
          tags="${image}:sha-${GITHUB_SHA}"
          if [ "$REF_TYPE" = "tag" ]; then
            version="${REF_NAME#api/v}"
            tags="${tags},${image}:${version},${image}:latest"
          else
            # Branch build. Only `main` reaches here, per the trigger.
            tags="${tags},${image}:${REF_NAME}"
          fi
          if [ -n "$EXTRA_TAG" ]; then
            tags="${tags},${image}:${EXTRA_TAG}"
          fi
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "Publishing: ${tags}"

      # Context is the repository root because go.mod lives there; the Dockerfile
      # builds the API from api/ (see api/Dockerfile).
      - name: Build and push
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./api/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          provenance: true
          sbom: true

      # The digest is what the deployment should pin, not any of the tags above.
      # Surfaced in the job summary so a handoff can quote it rather than
      # rediscover it from the registry.
      - name: Record the digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE: ${{ steps.tags.outputs.image }}
        run: |
          {
            echo "### Results API image published"
            echo
            echo '```'
            echo "${IMAGE}@${DIGEST}"
            echo '```'
            echo
            echo "Deploy the digest, not a tag: tags move, digests do not."
          } >> "$GITHUB_STEP_SUMMARY"
