# Publishes every container image this repository builds to ghcr.io: the results
# API and the batch pipeline's six.
#
# Releases are one repository-wide SemVer line, tagged `vX.Y.Z`
# (openspec/specs/release-versioning). One tag publishes every image from
# that commit; each system still deploys separately, by digest. This file was
# publish-cron-images.yml, and the API's publish-api-image.yml folded into it, so
# that tag handling and labels exist once.
#
# The pipeline's names are unchanged from what Cloud Build produced; only the
# registry and owner moved. `gcr.io/openssf/scorecard-batch-worker` became
# `ghcr.io/ossf/scorecard-batch-worker`, which kept the k8s manifests under
# `cron/k8s/` a prefix edit rather than a rename.
#
# Merges publish a MUTABLE `main` tag, which is what staging tracks. Releases
# publish IMMUTABLE semver tags and move `latest`, except pre-releases
# (`v0.2.0-rc.1`), which never move `latest`. Production pins a digest, not any
# tag. A manual dispatch's extra tag applies to every image.
#
# Every image is labelled with the release (`org.opencontainers.image.version`)
# and the Scorecard engine it was built against (`dev.scorecard.engine.version`,
# `dev.scorecard.engine.commit`). For the API the labels are the only record of
# the engine: its Dockerfile ignores the provenance build args below.
#
# The owner is parameterized so a fork can exercise this end to end against its
# own namespace. GHCR namespaces must be lowercase and `repository_owner`
# preserves the account's casing, so it is lowercased before use.
#
# NOT PUBLISHED HERE: `scorecard-webhook-releasetest`, which
# `cron/k8s/webhook.release.yaml` refers to. Every other release-test workload
# reuses its normal image under a `-releasetest` *deployment* name -- controller
# and worker both do -- so that reference is inconsistent with its neighbours and
# nothing in this repository has ever built it. The fix belongs in the manifest,
# not in minting an image to match it; it is recorded as
# `openspec/changes/migrate-batch-pipeline/tasks.md` task 4.4a.

name: publish-images

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Extra tag to apply (e.g. staging). The digest and SHA tag are always published.'
        required: false
        type: string

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: scorecard-api
            dockerfile: api/Dockerfile
          - image: scorecard-batch-controller
            dockerfile: cron/internal/controller/Dockerfile
          - image: scorecard-batch-worker
            dockerfile: cron/internal/worker/Dockerfile
          - image: scorecard-cii-worker
            dockerfile: cron/internal/cii/Dockerfile
          # BigQuery, which the cloud-agnostic rules exclude and which has no
          # equivalent in the destination. Published so the set is complete and
          # nothing is dropped silently; its future is an open question recorded
          # against the migration, not an oversight here.
          - image: scorecard-bq-transfer
            dockerfile: cron/internal/bq/Dockerfile
          - image: scorecard-webhook
            dockerfile: cron/internal/webhook/Dockerfile
          - image: scorecard-github-server
            dockerfile: cron/internal/githubserver/Dockerfile
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit # TODO(workflow): change to 'egress-policy: block' after a couple of runs

      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `v1.2.3` -> `1.2.3`. The commit SHA is always published alongside, so a
      # merge or a dispatch with no tag input still yields something immutable
      # to pin. The trigger's `v*` also matches tags that are not versions, so
      # the tag is checked here rather than published under a malformed name.
      - name: Derive tags
        id: tags
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          EXTRA_TAG: ${{ inputs.tag }}
          OWNER: ${{ github.repository_owner }}
          REGISTRY: ${{ env.REGISTRY }}
          NAME: ${{ matrix.image }}
        run: |
          owner="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          image="${REGISTRY}/${owner}/${NAME}"
          tags="${image}:sha-${GITHUB_SHA}"
          if [ "$REF_TYPE" = "tag" ]; then
            if ! printf '%s' "$REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
              echo "tag '${REF_NAME}' is not a vX.Y.Z[-prerelease] version" >&2
              exit 1
            fi
            version="${REF_NAME#v}"
            tags="${tags},${image}:${version}"
            # A pre-release never becomes what `latest` resolves to.
            case "$version" in
              *-*) ;;
              *) tags="${tags},${image}:latest" ;;
            esac
          else
            # Branch build. Only `main` reaches here, per the trigger.
            tags="${tags},${image}:${REF_NAME}"
          fi
          if [ -n "$EXTRA_TAG" ]; then
            tags="${tags},${image}:${EXTRA_TAG}"
          fi
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "Publishing: ${tags}"

      # Context is the repository root because go.mod lives there, matching the
      # Makefile's docker targets and build-images.yml.
      # .dockerignore excludes .git, so the Makefile's `git` calls all return
      # empty inside the build and the link flags baked "" into every binary.
      # Resolved out here, where the checkout and the network exist, and passed
      # in as build args and labels.
      - name: Resolve provenance
        id: provenance
        env:
          GIT_HASH: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = "tag" ]; then
            git_version="$REF_NAME"
          else
            git_version="$(git describe --tags --always)"
          fi

          # Read from go.mod rather than `go list -m`: there is no setup-go
          # step here, and the runner's toolchain need not match go.mod's.
          if grep -Eq '^\s*replace\s+github\.com/ossf/scorecard/v5|=>\s*github\.com/ossf/scorecard/v5' go.mod; then
            echo "go.mod replaces the engine module; resolve its commit by hand before publishing" >&2
            exit 1
          fi
          engine_version="$(awk '$1=="github.com/ossf/scorecard/v5"{print $2; exit}' go.mod)"
          if [ -z "$engine_version" ]; then
            echo "could not find github.com/ossf/scorecard/v5 in go.mod" >&2
            exit 1
          fi
          # The build graph knows the module version but not the commit it was
          # cut from; the module proxy does. Fail loudly rather than publish an
          # image whose results claim an engine commit of "".
          engine_commit="$(curl -sSf --retry 3 --max-time 30 \
            "https://proxy.golang.org/github.com/ossf/scorecard/v5/@v/${engine_version}.info" \
            | jq -r '.Origin.Hash // empty')"
          if ! printf '%s' "$engine_commit" | grep -Eq '^[0-9a-fA-F]{40}$'; then
            echo "could not resolve ${engine_version} to a commit SHA (got '${engine_commit}')" >&2
            exit 1
          fi

          {
            echo "git_hash=${GIT_HASH}"
            echo "git_version=${git_version}"
            echo "source_date_epoch=$(git log --date=iso8601-strict -1 --pretty=%ct)"
            echo "engine_version=${engine_version}"
            echo "engine_commit=${engine_commit}"
          } >> "$GITHUB_OUTPUT"
          echo "infra ${git_version} (${GIT_HASH}) / engine ${engine_version} (${engine_commit})"

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          provenance: true
          sbom: true
          labels: |
            org.opencontainers.image.version=${{ steps.provenance.outputs.git_version }}
            dev.scorecard.engine.version=${{ steps.provenance.outputs.engine_version }}
            dev.scorecard.engine.commit=${{ steps.provenance.outputs.engine_commit }}
          build-args: |
            GIT_HASH=${{ steps.provenance.outputs.git_hash }}
            GIT_VERSION=${{ steps.provenance.outputs.git_version }}
            GIT_TREESTATE=clean
            SOURCE_DATE_EPOCH=${{ steps.provenance.outputs.source_date_epoch }}
            SCORECARD_ENGINE_COMMIT=${{ steps.provenance.outputs.engine_commit }}

      # The digest is what a deployment should pin, not any of the tags above.
      - name: Record the digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE: ${{ steps.tags.outputs.image }}
        run: |
          {
            echo "### \`${IMAGE}\` published"
            echo
            echo '```'
            echo "${IMAGE}@${DIGEST}"
            echo '```'
            echo
            echo "Deploy the digest, not a tag: tags move, digests do not."
          } >> "$GITHUB_STEP_SUMMARY"
