# Override for exercising the S3-compatible store backend locally via MinIO:
#
#   docker compose -f docker-compose.yml -f docker-compose.minio.yml up --build

services:
  scorecard-api:
    environment:
      SCORECARD_RESULTS_BUCKET_URL: "s3://scorecard-results?region=us-east-1&endpoint=http://minio:9000&hostname_immutable=true&use_path_style=true"
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    depends_on:
      minio-init:
        condition: service_completed_successfully

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/scorecard-results
      "

volumes:
  minio-data:
